id: fetch/count/unset-means-all
spec_ref: relations/logical_relations.md#fetch-properties
kind: KIND_POSITIVE
notes: >-
  Offset two and no count at all. The two fields read their absence differently, and
  FetchRel says so in adjacent comments: an unset or null offset is treated as zero,
  while an unset or null count signals that all records should be returned. A consumer
  that defaults both to zero returns nothing here.
inputs:
  t_ord:
    schema: "k:i64?, v:string"
    rows:
      - ["3::i64?", "'c'::string"]
      - ["null::i64?", "'n'::string"]
      - ["1::i64?", "'a'::string"]
      - ["2::i64?", "'b'::string"]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [k, v]
        input:
          fetch:
            common: {direct: {}}
            input:
              sort:
                common: {direct: {}}
                input: {read: {common: {direct: {}}, $table: t_ord}}
                sorts:
                  - expr: "$0"
                    direction: SORT_DIRECTION_ASC_NULLS_LAST
            offset_expr: "2::i64"
expect:
  schema: "k:i64?, v:string"
  rows:
    order: ORDER_SEQUENCE
    values:
      - ["3::i64?", "'c'::string"]
      - ["null::i64?", "'n'::string"]
