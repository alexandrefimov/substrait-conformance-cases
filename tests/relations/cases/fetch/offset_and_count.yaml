id: fetch/offset-and-count/window
spec_ref: relations/logical_relations.md#fetch-operation
kind: KIND_POSITIVE
notes: >-
  Offset one, count two, over a sorted input so the window is well defined. The output
  type is unchanged from the input; what fetch changes is which records survive and,
  because the input is sorted, in what order.
inputs:
  t_ord:
    schema: "k:i64?, v:string"
    rows:
      - ["3::i64?", "'c'::string"]
      - ["null::i64?", "'n'::string"]
      - ["1::i64?", "'a'::string"]
      - ["2::i64?", "'b'::string"]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [k, v]
        input:
          fetch:
            common: {direct: {}}
            input:
              sort:
                common: {direct: {}}
                input: {read: {common: {direct: {}}, $table: t_ord}}
                sorts:
                  - expr: "$0"
                    direction: SORT_DIRECTION_ASC_NULLS_LAST
            offset_expr: "1::i64"
            count_expr: "2::i64"
expect:
  schema: "k:i64?, v:string"
  rows:
    order: ORDER_SEQUENCE
    values:
      - ["2::i64?", "'b'::string"]
      - ["3::i64?", "'c'::string"]
