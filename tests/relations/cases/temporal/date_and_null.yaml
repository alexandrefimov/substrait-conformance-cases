id: temporal/date/days-since-the-epoch
spec_ref: types/type_classes.md#simple-types
kind: KIND_POSITIVE
notes: >-
  A date is a day count from 1970-01-01 and carries no time of day, so the epoch
  itself is zero and nothing about a time zone enters into it. The nullable column
  beside it holds a null, which is the smallest check that a null of a temporal type
  survives the trip as a null of that type rather than as an untyped absence.
inputs:
  t_time:
    schema: "d:date, epoch:date, missing:date?"
    rows: [["'2024-03-01'::date", "'1970-01-01'::date", "null::date?"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [d, epoch, missing]
        input: {read: {common: {direct: {}}, $table: t_time}}
expect:
  schema: "d:date, epoch:date, missing:date?"
  rows:
    order: ORDER_MULTISET
    values: [["'2024-03-01'::date", "'1970-01-01'::date", "null::date?"]]
