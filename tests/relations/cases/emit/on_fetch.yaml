id: emit/on_fetch/mapping-on-a-fetch
spec_ref: relations/common_fields.md#emit
kind: KIND_POSITIVE
notes: >-
  An emit mapping on a fetch. The mapping is chosen so that a consumer taking the
  leading columns instead of the mapped ones answers with a different type, not merely
  a different order, so a schema comparison catches it and an executor catches it
  twice. The two columns are swapped, and they have different types, so the
  leading-columns answer is not even well typed against this expectation.
inputs:
  t_ord:
    schema: "k:i64?, v:string"
    rows:
      - ["3::i64?", "'c'::string"]
      - ["1::i64?", "'a'::string"]
      - ["2::i64?", "'b'::string"]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [v, k]
        input:
          fetch:
            common: {emit: {output_mapping: [1, 0]}}
            input:
              sort:
                common: {direct: {}}
                input: {read: {common: {direct: {}}, $table: t_ord}}
                sorts:
                  - expr: "$0"
                    direction: SORT_DIRECTION_ASC_NULLS_LAST
            offset_expr: "1::i64"
expect:
  schema: "v:string, k:i64?"
  rows:
    order: ORDER_SEQUENCE
    values:
      - ["'b'::string", "2::i64?"]
      - ["'c'::string", "3::i64?"]
