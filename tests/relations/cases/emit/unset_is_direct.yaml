id: emit/unset_is_direct/direct-equivalence
spec_ref: relations/common_fields.md#emit
kind: KIND_POSITIVE
notes: >-
  The relation carries no `common` section at all, which the spec makes equivalent to
  Direct: the columns pass through unchanged. Its pair, the explicit-direct case, is
  the same program written the other way and must produce the same answer. Consumers
  have gone wrong on exactly this difference, so the two cases are only meaningful
  together.
inputs:
  t_pair:
    schema: "a:i64, b:i64?"
    rows: [["7::i64", "null::i64?"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [a, b]
        input:
          filter:
            input: {read: {common: {direct: {}}, $table: t_pair}}
            condition: "true::bool"
expect:
  schema: "a:i64, b:i64?"
  rows:
    order: ORDER_MULTISET
    values: [["7::i64", "null::i64?"]]
