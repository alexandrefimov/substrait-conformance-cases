id: window/output-order/appends-after-the-input
spec_ref: relations/physical_relations.md#consistent-partition-window-operation
kind: KIND_POSITIVE
notes: >-
  Direct Output Order for a consistent partition window is the same as project: the
  input followed by each window expression. row_number takes no arguments and the
  extension declares its return as i64? with DECLARED_OUTPUT nullability, so the
  appended column is nullable whatever the input columns are.
extensions:
  arith: extension:io.substrait:functions_arithmetic
inputs:
  t_exp:
    schema: "c0:i64, c1:i64?, c2:string"
    rows: [["1::i64", "null::i64?", "'x'::string"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [c0, c1, c2, rn]
        input:
          window:
            common: {direct: {}}
            input: {read: {common: {direct: {}}, $table: t_exp}}
            window_functions:
              - function_reference: 1
                phase: AGGREGATION_PHASE_INITIAL_TO_RESULT
                invocation: AGGREGATION_INVOCATION_ALL
                output_type: "i64?"
                arguments: []
  extension_urns: [{extension_urn_anchor: 1, urn: "extension:io.substrait:functions_arithmetic"}]
  extensions: [{extension_function: {extension_urn_reference: 1, function_anchor: 1, name: "row_number:"}}]
expect:
  schema: "c0:i64, c1:i64?, c2:string, rn:i64?"
