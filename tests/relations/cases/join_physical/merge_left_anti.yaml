id: join_physical/merge_left_anti/wire-7
spec_ref: relations/physical_relations.md#merge-join-operator
kind: KIND_POSITIVE
notes: >-
  Wire number 7, which `HashJoinRel`, `MergeJoinRel` and `NestedLoopJoinRel` all read
  as a left anti join while `JoinRel` reads it as a left single join. The hash join
  cases pin the four ambiguous numbers; this one and its merge join sibling check that
  the physical numbering really is shared across all three messages rather than a
  property of `HashJoinRel`. A merge join takes comparison keys, each naming a field
  of its own input, as a hash join does.
inputs:
  t_left:
    schema: "a0:i64, a1:i64?"
    rows: [["1::i64", "null::i64?"], ["2::i64", "2::i64?"]]
  t_right:
    schema: "b0:i64, b1:i64?"
    rows: [["2::i64", "20::i64?"], ["5::i64", "50::i64?"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [a0, a1]
        input:
          merge_join:
            common: {direct: {}}
            type: JOIN_TYPE_LEFT_ANTI
            left: {read: {common: {direct: {}}, $table: t_left}}
            right: {read: {common: {direct: {}}, $table: t_right}}
            keys:
              - left: {direct_reference: {struct_field: {field: 0}}, root_reference: {}}
                right: {direct_reference: {struct_field: {field: 0}}, root_reference: {}}
                comparison: {simple: SIMPLE_COMPARISON_TYPE_EQ}
expect:
  schema: "a0:i64, a1:i64?"
  rows:
    order: ORDER_MULTISET
    values: [["1::i64", "null::i64?"]]
