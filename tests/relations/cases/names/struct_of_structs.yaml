id: names/struct_of_structs/seven-names-for-two-columns
spec_ref: types/named_structs.md#determining-names
kind: KIND_POSITIVE
notes: >-
  The specification works this exact shape out under Structs within Struct and counts
  seven names: one for the first nested struct, two for its fields, one for the
  second, three for its fields. Two columns, seven names, and the case is that count.
inputs:
  t_deep:
    schema: "a:struct<b:i64, c:i64>, d:struct<e:i64, f:i64, g:i64>"
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [a, b, c, d, e, f, g]
        input: {read: {common: {direct: {}}, $table: t_deep}}
expect:
  schema: "a:struct<b:i64, c:i64>, d:struct<e:i64, f:i64, g:i64>"
