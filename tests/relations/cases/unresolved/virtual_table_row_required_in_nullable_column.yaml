id: unresolved/virtual_table/row-required-in-nullable-column
spec_ref: relations/logical_relations.md#virtual-table
kind: KIND_UNRESOLVED
unresolved:
  issue: substrait-io/substrait#1211
  why: >-
    The row supplies a required i64 literal for a column the base_schema declares
    nullable. Nullability is part of a type and the type system forbids implicit
    coercion, which would make this invalid; but nullability is also stripped before
    binding under MIRROR and DECLARED_OUTPUT, and widening in this direction is what
    engines do silently. The spec does not settle it, so the case ships without an
    expectation and is never scored.
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  relations:
    - root:
        names: [n]
        input:
          read:
            common: {direct: {}}
            base_schema: "n:i64?"
            virtual_table:
              expressions:
                - {fields: ["1::i64"]}
