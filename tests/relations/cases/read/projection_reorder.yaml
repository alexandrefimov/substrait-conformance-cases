id: read/projection/mask-reorders
spec_ref: relations/logical_relations.md#read-properties
kind: KIND_UNRESOLVED
unresolved:
  tracked_in: expressions/field_references.md#discussion-points
  why: >-
    The mask selects field 2 before field 0. Three passages bear on what that means and
    they do not agree. The Read table says the output defaults to the direct schema
    after the projection is applied, and struct_items is a repeated field whose order is
    meaningful in protobuf, which reads as c2:bool, c0:i64. Against that, the
    MaskExpression comment in algebra.proto says a mask "does not fundamentally alter
    the structure of data beyond the elimination of unnecessary elements", and the
    Discussion Points block in field_references.md says "Should we support column
    reordering/positioning using a masked complex expression? (Right now, you can only
    mask things out.)". Both of those read as c0:i64, c2:bool. The weight of the text is
    on the second reading. What keeps the case unscored is that the specification files
    the question under Discussion Points rather than answering it, and that the two
    implementations which answer at all take the first reading. The readings differ in
    the schema and not only in the verdict, so there is no expectation that would be
    fair to either. The root names are positional rather than c0 and c2 for the same
    reason: naming them after the input columns would be the case taking a side.
inputs:
  t_mix:
    schema: "c0:i64, c1:string, c2:bool"
    rows: [["10::i64", "'x'::string", "true::bool"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [first, second]
        input:
          read:
            common: {direct: {}}
            $table: t_mix
            projection:
              select: {struct_items: [{field: 2}, {field: 0}]}
              maintain_singular_struct: false
