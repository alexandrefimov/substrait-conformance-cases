id: read/mask/narrows-a-struct-from-inside
spec_ref: expressions/field_references.md#masked-complex-expression
kind: KIND_POSITIVE
notes: >-
  A struct item may carry a child select, and the specification works exactly this
  shape out: a mask over nested structs that keeps some fields at the top and some
  inside them, with the resulting schema printed. Here the mask keeps column 1 and,
  within it, fields 0 and 2, so the output is one struct column of two fields. Both
  levels keep two fields so nothing here depends on maintain_singular_struct, which
  the protobuf does not document. A consumer that applies the top level and ignores
  the child returns the struct whole, which is what the sibling case looks like.
inputs:
  t_mask:
    schema: "a:i64, s:struct<x:i64, y:string, z:bool>"
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [s, x, z]
        input:
          read:
            common: {direct: {}}
            $table: t_mask
            projection:
              select:
                struct_items:
                  - field: 1
                    child:
                      struct:
                        struct_items: [{field: 0}, {field: 2}]
              maintain_singular_struct: false
expect:
  schema: "s:struct<x:i64, z:bool>"
