id: expand/fields/beyond-the-definitions
spec_ref: relations/physical_relations.md#expand-operation
kind: KIND_POSITIVE
notes: >-
  One definition for a three-column input. The rule is in the ExpandRel comment in
  algebra.proto and nowhere in the documentation: there should be one definition per
  input field, and any field beyond the definitions is emitted as is, as if a
  consistent field with an identity expression had been given. So the output is the
  one defined field, then the input's second and third columns untouched, then the
  index. A consumer that stops at the definitions returns two columns instead of four.
inputs:
  t_exp:
    schema: "c0:i64, c1:i64?, c2:string"
    rows: [["1::i64", "null::i64?", "'x'::string"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [f1, c1, c2, duplicate]
        input:
          expand:
            common: {direct: {}}
            input: {read: {common: {direct: {}}, $table: t_exp}}
            fields:
              - consistent_field: "$1"
expect:
  schema: "f1:i64?, c1:i64?, c2:string, duplicate:i32"
  rows:
    order: ORDER_MULTISET
    values: [["null::i64?", "null::i64?", "'x'::string", "0::i32"]]
