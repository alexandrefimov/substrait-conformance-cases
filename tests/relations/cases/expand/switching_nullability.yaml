id: expand/switching/nullability-is-the-union
spec_ref: relations/physical_relations.md#expand-operation
kind: KIND_POSITIVE
notes: >-
  One switching field whose two duplicates are a required i64 and a nullable one.
  algebra.proto states the rule on SwitchingField itself and the documentation does
  not repeat it: all duplicates must return the same type class but may differ in
  nullability, and the output field is nullable if any duplicate is. Each input row
  becomes two output rows, one per duplicate, and the trailing index says which.
inputs:
  t_exp:
    schema: "c0:i64, c1:i64?, c2:string"
    rows: [["1::i64", "null::i64?", "'x'::string"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [s, c1, c2, duplicate]
        input:
          expand:
            common: {direct: {}}
            input: {read: {common: {direct: {}}, $table: t_exp}}
            fields:
              - switching_field: {duplicates: ["$0", "$1"]}
              - consistent_field: "$1"
              - consistent_field: "$2"
expect:
  schema: "s:i64?, c1:i64?, c2:string, duplicate:i32"
  rows:
    order: ORDER_MULTISET
    values:
      - ["1::i64?", "null::i64?", "'x'::string", "0::i32"]
      - ["null::i64?", "null::i64?", "'x'::string", "1::i32"]
