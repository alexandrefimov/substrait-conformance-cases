id: aggregate/grouping_sets/overlapping-sets
spec_ref: relations/logical_relations.md#aggregate-operation
kind: KIND_POSITIVE
notes: >-
  Two grouping sets that overlap, so the output order and the nullability rule can be
  told apart. Grouping expression $0 is in both sets and keeps its required i64; $1 is
  in only one and is widened to nullable. The columns come out in the order the
  grouping expressions are declared, not in the order the sets reference them, which
  is the part the disjoint-sets case cannot show: there each expression appears in
  exactly one set and the two orders coincide.
extensions:
  arith: extension:io.substrait:functions_arithmetic
inputs:
  t_group:
    schema: "g0:i64, g1:string, v:i64"
    rows: [["1::i64", "'a'::string", "10::i64"], ["1::i64", "'b'::string", "20::i64"]]
plan:
  version: {minor_number: 102, producer: substrait-relation-tests}
  execution_behavior: {variable_eval_mode: VARIABLE_EVALUATION_MODE_PER_PLAN}
  relations:
    - root:
        names: [g0, g1, total, grouping_set]
        input:
          aggregate:
            common: {direct: {}}
            input: {read: {common: {direct: {}}, $table: t_group}}
            grouping_expressions: ["$0", "$1"]
            groupings:
              - {expression_references: [0]}
              - {expression_references: [0, 1]}
            measures:
              - measure:
                  function_reference: 1
                  phase: AGGREGATION_PHASE_INITIAL_TO_RESULT
                  invocation: AGGREGATION_INVOCATION_ALL
                  output_type: "i64?"
                  arguments: [{value: "$2"}]
  extension_urns: [{extension_urn_anchor: 1, urn: "extension:io.substrait:functions_arithmetic"}]
  extensions: [{extension_function: {extension_urn_reference: 1, function_anchor: 1, name: "sum:i64"}}]
expect:
  schema: "g0:i64, g1:string?, total:i64?, grouping_set:i32"
  rows:
    order: ORDER_MULTISET
    values:
      - ["1::i64", "null::string?", "30::i64?", "0::i32"]
      - ["1::i64", "'a'::string?", "10::i64?", "1::i32"]
      - ["1::i64", "'b'::string?", "20::i64?", "1::i32"]
