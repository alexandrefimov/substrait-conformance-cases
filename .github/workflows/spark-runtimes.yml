name: Spark runtimes

on:
  push:
  pull_request:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
    inputs:
      latest_java:
        description: Build current substrait-java main instead of the saved revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      java: ${{ steps.config.outputs.java }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: config
        run: |
          echo "versions=$(python3 probe/spark_runtime.py --list)" >> "$GITHUB_OUTPUT"
          . probe/versions.env
          echo "java=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

  runtime:
    needs: profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spark: ${{ fromJSON(needs.profiles.outputs.versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ needs.profiles.outputs.java }}
      - name: Build and measure the runtime
        env:
          SPARK_VERSION: ${{ matrix.spark }}
          LATEST_JAVA: ${{ github.event_name == 'schedule' || inputs.latest_java == true }}
        run: |
          args=()
          if [ "$LATEST_JAVA" = true ]; then args+=(--latest); fi
          python3 probe/spark_runtime.py "$SPARK_VERSION" --out run "${args[@]}"
      - name: Show observations
        if: always()
        run: |
          if [ -f run/summary.txt ]; then
            cat run/summary.txt >> "$GITHUB_STEP_SUMMARY"
          elif [ -f run/failure.json ]; then
            cat run/failure.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spark-${{ matrix.spark }}
          path: run/
