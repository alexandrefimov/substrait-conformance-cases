# The saved columns against today's release instead of the pinned one. A difference here is not a
# failure: it says the participant moved since results/<NAME>.txt or results/relations/<NAME>.txt
# was taken, and names the cases it moved on. selfcheck.yml is the other direction - the pinned
# versions, where a difference means something in this repository is wrong.
#
# Weekly rather than per-push: nothing in a commit here changes what DuckDB released.
name: drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        column: [PYTHON, GO, DUCKDB, ACERO, VALIDATOR, JAVA, ISTHMUS, SPARK, DATAFUSION]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Not the minimum this time: the drift run asks what today's toolchain and today's release do
      # together, and a substrait-go that has started needing a newer go is itself a finding.
      - uses: actions/setup-go@v5
        if: matrix.column == 'GO'
        with:
          go-version: stable
      # Both of these are built from source and both compile .proto files that import
      # google/protobuf/any.proto, which Debian and Ubuntu ship apart from the compiler, in
      # libprotobuf-dev. Without that second package the validator's build dies deep inside maturin
      # with "File not found", naming neither package.
      - if: matrix.column == 'VALIDATOR' || matrix.column == 'DATAFUSION'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      # The JDK the substrait-java columns were measured with, read from versions.env rather than
      # written again here: a second copy would let CI pass on a toolchain the file does not name.
      - id: java
        if: matrix.column == 'JAVA' || matrix.column == 'ISTHMUS' || matrix.column == 'SPARK'
        run: . probe/versions.env && echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: matrix.column == 'JAVA' || matrix.column == 'ISTHMUS' || matrix.column == 'SPARK'
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      # JAVA17_HOME is what the Spark probe looks for, and it finds one by itself only on a Mac.
      - run: JAVA17_HOME="$JAVA_HOME" LATEST=1 OUT=run bash probe/replay_column.sh ${{ matrix.column }}
      # The run, not just the verdict: the record names the versions that were actually installed,
      # the revision this repository was at and a fingerprint of the corpus, the expectations and
      # the normalization, so a later reader can tell a moved answer from a changed input.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-${{ matrix.column }}
          path: run/

  # The relation columns, against the same releases. Their own job because they are retaken by their
  # own script over their own participants; the setup is the one selfcheck.yml's relations job has,
  # with today's go in place of the minimum for the reason given above.
  relations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        column: [DUCKDB, GO, JAVA, DATAFUSION]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: actions/setup-go@v5
        if: matrix.column == 'GO'
        with:
          go-version: stable
      - id: java
        if: matrix.column == 'JAVA'
        run: . probe/versions.env && echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: matrix.column == 'JAVA'
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      - run: LATEST=1 OUT=run bash probe/relations/replay.sh ${{ matrix.column }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-relations-${{ matrix.column }}
          path: run/

  # One job writes the log, because the thirteen above run in parallel in separate checkouts and
  # thirteen jobs appending to one file would race. It collects whatever blocks they left - a
  # participant that did not move leaves none - and writes them in a fixed order rather than the
  # order the jobs finished in.
  record:
    needs: [drift, relations]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: runs
          pattern: drift-*
      # Sorted by the day in each block's header, keeping the matrices' order within a day: a
      # dispatch that runs across midnight UTC has jobs dated either side of it, and
      # probe/selfcheck.sh refuses a log whose days run backwards.
      - id: collect
        run: |
          : > found
          for c in PYTHON GO DUCKDB ACERO VALIDATOR JAVA ISTHMUS SPARK DATAFUSION; do
            f="runs/drift-$c/$c.drift"
            [ -s "$f" ] && echo "$f" >> found
          done
          for c in DUCKDB GO JAVA DATAFUSION; do
            f="runs/drift-relations-$c/$c.drift"
            [ -s "$f" ] && echo "$f" >> found
          done
          : > blocks
          n=0
          while read -r f; do
            n=$((n + 1))
            printf '%s\t%05d\t%s\n' "$(head -1 "$f" | cut -d' ' -f2)" "$n" "$f"
          done < found | sort -t $'\t' -k1,1 -k2,2n | cut -f3 > ordered
          while read -r f; do cat "$f" >> blocks && echo >> blocks; done < ordered
          rm -f found ordered
          if [ -s blocks ]; then
            cat blocks >> results/DRIFT.txt
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            cat blocks >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nothing moved; results/DRIFT.txt is unchanged"
            echo "moved=no" >> "$GITHUB_OUTPUT"
          fi
          rm -f blocks
      # Only when something moved: a commit a week saying nothing happened is a commit a week
      # nobody reads, and the workflow's own history already records that the run took place.
      - if: steps.collect.outputs.moved == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/DRIFT.txt
          git commit -m "Record what moved in the drift run of $(date -u +%Y-%m-%d)"
          git push
