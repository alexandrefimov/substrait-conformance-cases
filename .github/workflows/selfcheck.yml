# The repository checked against itself: seconds, python3 only, no external checkout.
# The full sweep over the implementations is probe/reverify.sh, which needs a substrait-java and a
# DataFusion checkout, several toolchains, and a cluster for the Gluten column. It does not run here.
name: selfcheck

on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash probe/selfcheck.sh
      # And that those checks can fail: each invariant is broken in a copy and the check has to
      # notice its own. Three guards in this repository were written, committed, and could never
      # fire; two of them lived in checks.
      - run: bash probe/selfcheck-negative.sh

  # Columns reproduced rather than read. These five participants are the ones a machine that is not
  # the author's can build from the pinned versions, retake and require to be identical: four are a
  # pip install or a go get, and the validator is a clone and a cargo build. That is five of the
  # nine; the other four want a substrait-java or a DataFusion checkout or a JDK 17, and remain
  # saved measurements until someone automates those too.
  column:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        column: [PYTHON, GO, DUCKDB, ACERO, VALIDATOR]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The go version is the one versions.env calls the minimum, read from that file rather than
      # written again here: a second copy would let CI pass on a go the file does not promise.
      - id: go
        if: matrix.column == 'GO'
        run: . probe/versions.env && echo "version=$GO_MINIMUM" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: matrix.column == 'GO'
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The validator is built from source. protoc is not on the runner, and its build compiles
      # .proto files that import google/protobuf/any.proto - which Debian and Ubuntu ship apart from
      # the compiler, in libprotobuf-dev. Without that second package the build dies deep inside
      # maturin with "File not found", naming neither package.
      - if: matrix.column == 'VALIDATOR'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - run: OUT=run bash probe/replay_column.sh ${{ matrix.column }}
      # Kept whether the comparison passed or failed: a column that differs is the run worth having.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: column-${{ matrix.column }}
          path: run/
