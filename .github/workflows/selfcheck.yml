# The repository checked against itself: seconds, python3 only, no external checkout.
# The full sweep over the implementations is probe/reverify.sh, which needs a substrait-java and a
# DataFusion checkout, several toolchains, and a cluster for the Gluten column. It does not run here.
name: selfcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash probe/selfcheck.sh
      # And that those checks can fail: each invariant is broken in a copy and the check has to
      # notice its own. Three guards in this repository were written, committed, and could never
      # fire; two of them lived in checks.
      - run: bash probe/selfcheck-negative.sh

  # The relation corpus is a second measurement on a second set of cases, and its columns need the
  # same guarantee: probe/selfcheck.sh checks them against the extract and against the picture, but
  # it runs no participant, so a column of it could go stale without anything noticing. Four
  # participants, each built from nothing by probe/relations/setup.sh and required to return its
  # saved column answer for answer.
  relations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        column: [DUCKDB, GO, JAVA, DATAFUSION]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Every participant reads a bundle with bindings protoc generates, and relation_test.proto
      # imports the Substrait protos, which import google/protobuf/any.proto - shipped apart from
      # the compiler on Debian and Ubuntu, in libprotobuf-dev.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      # Both toolchain versions are read from versions.env rather than written again here: a second
      # copy would let CI pass on a toolchain the file does not promise.
      - id: go
        if: matrix.column == 'GO'
        run: . probe/versions.env && echo "version=$GO_MINIMUM" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.column == 'GO'
        with:
          go-version: ${{ steps.go.outputs.version }}
      - id: java
        if: matrix.column == 'JAVA'
        run: . probe/versions.env && echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.column == 'JAVA'
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      - run: bash probe/relations/replay.sh ${{ matrix.column }}

  # Columns reproduced rather than read: built from the pinned versions on a machine that is not the
  # author's, retaken, and required to be identical. Four are a pip install or a go get, the
  # validator is a clone and a cargo build, and the substrait-java pair is a clone and a Gradle
  # build, which serves the three columns that come out of it, and DataFusion is a clone without
  # blobs and a cargo build. That is all nine; only Gluten, which runs in a cluster, is still taken
  # by hand.
  column:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        column: [PYTHON, GO, DUCKDB, ACERO, VALIDATOR, JAVA, ISTHMUS, SPARK, DATAFUSION]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The go version is the one versions.env calls the minimum, read from that file rather than
      # written again here: a second copy would let CI pass on a go the file does not promise.
      - id: go
        if: matrix.column == 'GO'
        run: . probe/versions.env && echo "version=$GO_MINIMUM" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.column == 'GO'
        with:
          go-version: ${{ steps.go.outputs.version }}
      # Both of these are built from source and both compile .proto files that import
      # google/protobuf/any.proto, which Debian and Ubuntu ship apart from the compiler, in
      # libprotobuf-dev. Without that second package the validator's build dies deep inside maturin
      # with "File not found", naming neither package.
      - if: matrix.column == 'VALIDATOR' || matrix.column == 'DATAFUSION'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      # The JDK the substrait-java columns were measured with, read from versions.env rather than
      # written again here: a second copy would let CI pass on a toolchain the file does not name.
      - id: java
        if: matrix.column == 'JAVA' || matrix.column == 'ISTHMUS' || matrix.column == 'SPARK'
        run: . probe/versions.env && echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.column == 'JAVA' || matrix.column == 'ISTHMUS' || matrix.column == 'SPARK'
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      # JAVA17_HOME is what the Spark probe looks for, and it finds one by itself only on a Mac.
      - run: JAVA17_HOME="$JAVA_HOME" OUT=run bash probe/replay_column.sh ${{ matrix.column }}
      # Kept whether the comparison passed or failed: a column that differs is the run worth having.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: column-${{ matrix.column }}
          path: run/
